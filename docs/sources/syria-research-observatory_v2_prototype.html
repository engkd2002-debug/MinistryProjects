<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>منصة البحث العلمي السوري — النموذج الأولي 2.0</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b2a4a;--navy2:#143d66;--teal:#12868f;--gold:#c8a04a;--ink:#17283d;--mut:#66788d;--line:#dde5ee;--bg:#f3f6fa;--card:#fff;--c1:#2f7fd0;--c2:#2aa38a;--c3:#e29a2f;--c4:#d2503f}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}
body{font-family:"IBM Plex Sans Arabic","Tajawal","Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--ink);font-size:13px;display:grid;grid-template-rows:auto auto 1fr}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.ban{background:linear-gradient(100deg,var(--navy),var(--navy2));color:#fff;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:8px 22px;gap:16px;border-bottom:3px solid var(--gold)}
.ban-r{display:flex;align-items:center;gap:14px}.ban-r img{width:64px;height:64px;border-radius:50%;background:var(--card);padding:2px;object-fit:contain}
.l3{display:flex;flex-direction:column;line-height:1.35}.l3 b{font-size:17px}.l3 span{font-size:14px;opacity:.92}.l3 em{font-style:normal;font-size:12px;opacity:.78}
.ban-c{text-align:center;display:flex;flex-direction:column;line-height:1.35}.ban-c h1{margin:0;font-size:24px;font-weight:700}.ban-c h2{margin:0;font-size:14px;font-weight:500;opacity:.92}.ban-c p{margin:0;font-size:12px;opacity:.75}
.ban-l{display:flex;justify-content:flex-end;gap:8px;align-items:center}
.ban-l button,.ban-l select{background:var(--card)fff1a;border:1px solid #ffffff44;color:#fff;border-radius:8px;padding:6px 10px}.ban-l select option{color:#000}
.strip{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border-bottom:1px solid var(--line);padding:6px 16px}
.kpis{display:flex;gap:8px}.kpi{border:1px solid var(--line);border-radius:10px;padding:2px 10px;min-width:74px;border-inline-start:3px solid var(--teal)}.kpi b{display:block;font-size:19px;color:var(--navy);line-height:1.2}.kpi span{font-size:11px;color:var(--mut)}
.tools{display:flex;gap:4px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 7px;font-weight:600;font-size:11.5px;color:var(--navy);white-space:nowrap}
.btn:hover{background:#eef4fa}.btn.on{background:var(--navy);color:#fff}.btn.pri{background:var(--teal);color:#fff;border-color:var(--teal)}.btn[disabled]{opacity:.4;cursor:not-allowed}
main{display:grid;grid-template-columns:430px 1fr;min-height:0}
aside{background:var(--card);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.ph{padding:8px 10px;display:flex;flex-direction:column;gap:6px;max-height:62%;overflow:auto;border-bottom:1px solid var(--line);background:#fafcfe}
.fr{border:1px solid var(--line);border-radius:10px;background:var(--card)}.fr>h3{margin:0;display:flex;justify-content:space-between;align-items:center;padding:6px 10px;font-size:13px;font-weight:600;color:var(--navy);cursor:pointer}
.fr>h3 i{font-style:normal;width:22px;height:22px;display:grid;place-items:center;border-radius:6px;background:#eaf1f8;font-weight:700}.fr .bd{padding:4px 10px 10px;display:none}.fr.open .bd{display:block}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px}.fr select,.fr input,.fld input,.fld select,.fld textarea{width:100%;border:1px solid #cfd9e5;border-radius:8px;padding:6px 8px;background:var(--card)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.chip{background:#e8f1f8;border-radius:20px;padding:2px 9px;font-size:11px;color:var(--navy)}.chip button{border:0;background:none;padding:0 0 0 4px;font-weight:700}
.rh{display:flex;justify-content:space-between;padding:6px 14px;color:var(--mut);font-size:12px}.rh b{color:var(--navy)}
#list{flex:1;overflow:auto;padding:0 10px 10px;min-height:0}
.card{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:7px;cursor:pointer;background:var(--card);border-inline-start:3px solid var(--teal)}.card:hover{box-shadow:0 4px 14px #0b2a4a1a}
.card h4{margin:0 0 4px;font-size:13.5px;line-height:1.5}.meta{display:flex;flex-wrap:wrap;gap:3px 10px;font-size:11.5px;color:var(--mut)}.tag{background:#eef3f8;border-radius:5px;padding:0 6px;font-size:11px}.tag.s{background:#fdf3dc;color:#8a6410}
.why{margin-top:4px;font-size:11px;color:var(--teal)}
#mapw{position:relative;min-height:0;background:radial-gradient(circle at 45% 45%,#f9fbfe,#e9f0f7);overflow:hidden}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}#map.drag{cursor:grabbing}
.reg{fill:#dbe6f1;stroke:#fff;stroke-width:1.3;fill-rule:evenodd;vector-effect:non-scaling-stroke;transition:fill .15s}.reg:hover{fill:#c4d9ee}.reg.sel{fill:#bcd6ee;stroke:var(--gold);stroke-width:2.4}
.lbl{font-size:11px;fill:#7b8fa5;text-anchor:middle;pointer-events:none;font-weight:500}.bl{font-size:11px;fill:var(--navy);text-anchor:middle;font-weight:600;paint-order:stroke;stroke:var(--card);stroke-width:3px;pointer-events:none}.bn{fill:#fff;text-anchor:middle;font-weight:700;pointer-events:none}
.bub{cursor:pointer;stroke:#fff;stroke-width:2;opacity:.93}.bub:hover{opacity:1;stroke:var(--gold)}.lead{stroke:#5d7287;stroke-width:1;stroke-dasharray:3 2;vector-effect:non-scaling-stroke}.dot{fill:var(--navy);stroke:#fff;stroke-width:1.2;cursor:pointer}
.mc{position:absolute;inset-inline-end:12px;top:48px;display:flex;flex-direction:column;gap:4px}.mc button{width:34px;height:34px;border:1px solid var(--line);background:var(--card);border-radius:8px;font-size:17px;font-weight:700}
.leg{position:absolute;inset-inline-start:12px;bottom:12px;background:var(--card)fffee;border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:11px;max-width:260px}.leg div{display:flex;align-items:center;gap:6px;margin:2px 0}.leg i{width:11px;height:11px;border-radius:50%;display:inline-block}.leg input{width:44px;padding:1px 3px;border:1px solid #cfd9e5;border-radius:4px}
.lvl{position:absolute;inset-inline-end:12px;top:12px;display:flex;gap:6px;align-items:center}.lvl span{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:3px 12px;font-size:11.5px;color:var(--navy);font-weight:600}
.info{position:absolute;inset-inline-start:200px;top:12px;width:270px;background:var(--card);border-radius:12px;box-shadow:0 10px 30px #0b2a4a33;padding:12px;display:none;border-top:3px solid var(--gold)}.info.show{display:block}
.info h3{margin:0 0 2px;font-size:17px;color:var(--navy)}.info small{color:var(--mut)}.info .row{display:flex;justify-content:space-between;font-size:12px;padding:2px 0;border-bottom:1px dashed var(--line)}.info h5{margin:8px 0 2px;font-size:11.5px;color:var(--teal)}
.x{position:absolute;inset-inline-end:8px;top:6px;border:0;background:none;font-size:18px;color:var(--mut)}
.dash{position:absolute;inset:0;background:var(--bg);padding:14px;display:none;grid-template-columns:repeat(3,1fr);grid-template-rows:auto;grid-auto-rows:minmax(230px,auto);gap:10px;overflow:auto;z-index:5}.dash.show{display:grid}
.dc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:0;overflow:auto}.dc h4{margin:0 0 6px;font-size:13px;color:var(--navy)}.dc.w{grid-column:1/-1}
.br{display:grid;grid-template-columns:130px 1fr 28px;gap:6px;align-items:center;margin:3px 0;cursor:pointer;font-size:11.5px}.br span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.br i{display:block;height:9px;border-radius:5px;background:var(--teal)}.br:hover i{background:var(--gold)}
.yr{display:flex;align-items:flex-end;gap:8px;height:90px}.yr div{flex:1;text-align:center;font-size:11px;cursor:pointer}.yr i{display:block;background:var(--navy2);border-radius:4px 4px 0 0;margin:2px auto 0;width:70%}.yr div:hover i{background:var(--gold)}
.dkp{display:flex;gap:10px}.dkp .kpi{flex:1}
dialog{border:0;border-radius:14px;padding:0;width:min(720px,94vw);max-height:90vh;box-shadow:0 20px 60px #0b2a4a55;color:var(--ink)}dialog::backdrop{background:#0b2a4a88}
.dh{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;background:var(--navy);color:#fff;position:sticky;top:0}.dh h3{margin:0;font-size:15px}.dh button{border:0;background:none;color:#fff;font-size:20px}
.db{padding:14px 18px;overflow:auto;max-height:calc(90vh - 56px)}.sec{margin:8px 0 4px;font-weight:700;color:var(--teal);font-size:12.5px;border-bottom:1px solid var(--line);padding-bottom:2px}
.fld{display:flex;flex-direction:column;gap:2px;margin:5px 0;font-size:12px}.fld.f2{grid-column:1/-1}.fg{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}.kv div{border-bottom:1px dashed var(--line);padding:3px 0}.kv label{display:block;font-size:11px;color:var(--mut)}
.ai{background:#f1f9f9;border:1px dashed var(--teal);border-radius:8px;padding:6px 8px;font-size:11px;color:#245e63;margin-bottom:6px}.ex{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.ex button{border:1px solid #cfe3e5;background:var(--card);border-radius:16px;padding:2px 9px;font-size:11px}
.rst{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--navy);background:var(--card);display:grid;place-items:center;padding:0}.rst:hover{background:#fdecea;border-color:var(--c4)}
aside{position:relative}.yrf{position:absolute;inset-inline-start:12px;top:12px;width:176px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 20px #0b2a4a22;z-index:3}
.yrf h3{margin:0;display:flex;justify-content:space-between;align-items:center;padding:7px 12px;font-size:13px;color:var(--navy);cursor:pointer}.yrf h3 i{font-style:normal;width:22px;height:22px;display:grid;place-items:center;border-radius:6px;background:#eaf1f8;font-weight:700}
.yrf .bd{display:none;padding:0 10px 10px}.yrf.open .bd{display:block}.yrf small{display:block;color:var(--mut);font-size:10.5px;margin-bottom:5px}
#yrL{max-height:210px;overflow-y:auto;display:flex;flex-direction:column;gap:3px;padding-inline-end:3px}#yrL button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px;font-weight:600}#yrL button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
#cmpBar{position:absolute;inset-inline:14px;bottom:12px;background:var(--navy);color:#fff;border-radius:16px;padding:8px 12px;display:none;align-items:center;justify-content:space-between;gap:8px;box-shadow:0 8px 24px #0b2a4a55;z-index:4}#cmpBar.show{display:flex}#cmpBar .btn{padding:5px 10px}
.cb{padding:1px 8px!important;font-size:11px!important}.cb.on{background:var(--gold);border-color:var(--gold)}
.cs{display:flex;gap:18px;overflow-x:auto;background:var(--card)8dc;border:1px solid #ecd98a;border-radius:10px;padding:8px 14px;margin:8px 0;white-space:nowrap;font-weight:600}.cw{overflow:auto;border:1px solid var(--line);border-radius:10px}
.ct{border-collapse:collapse;width:100%;font-size:12px}.ct th,.ct td{border:1px solid var(--line);padding:7px 9px;vertical-align:top;min-width:170px;text-align:start}.ct th:first-child,.ct td:first-child{min-width:110px;background:#f3f6fa;font-weight:700;position:sticky;inset-inline-start:0}.ct thead th{background:var(--navy);color:#fff}.ct thead th:first-child{background:var(--navy)!important;color:#fff}.ct td.df{background:var(--card)3bf}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:8px 18px;border-radius:20px;display:none;z-index:99}
body.en{direction:ltr}
@media(max-width:1100px){main{grid-template-columns:360px 1fr}.ban-c h1{font-size:19px}.kpi{min-width:70px}}

body.dark{--bg:#0c1622;--card:#14202e;--ink:#e4ecf5;--mut:#9db0c4;--line:#27384b;--navy:#9cc3ee;--teal:#3fb6bf}
body.dark .ban{background:linear-gradient(100deg,#0b2a4a,#143d66);color:#fff}body.dark .dh,body.dark .ct thead th,body.dark #cmpBar{background:#0b2a4a;color:#fff}body.dark .btn.on{background:#2b5d8f;color:#fff}body.dark .btn.pri,body.dark #yrL button.on{background:#12868f;color:#fff}
body.dark #mapw{background:radial-gradient(circle at 45% 45%,#14202e,#0c1622)}body.dark .reg{fill:#223a52;stroke:#0c1622}body.dark .reg:hover,body.dark .reg.sel{fill:#2d4a66}body.dark .lbl{fill:#8aa0b6}
body.dark .ph,body.dark .tag,body.dark .chip,body.dark .fr>h3 i,body.dark .yrf h3 i,body.dark .ct td:first-child{background:#1b2b3d;color:var(--ink)}body.dark .fr select,body.dark .fr input,body.dark .fld input,body.dark .fld select,body.dark .fld textarea,body.dark .leg input{background:#0f1a27;color:var(--ink);border-color:#2d4157}
body.dark .cs{background:#2b2610;border-color:#6b5a1d;color:#f1e3a6}body.dark .ct td.df{background:#4a3f12}body.dark .ai{background:#10272a;color:#9fdadf}body.dark .bl,body.dark .bn{fill:var(--ink)}body.dark .bn{fill:#fff}body.dark .yr i{background:#4b7fb3}body.dark .kpi b,body.dark .info h3{color:#cfe0f2}
.gm td{text-align:center;font-weight:600}.gm td:first-child{text-align:start}
@media print{body>*:not(.ban):not(main){display:none!important}html,body{overflow:visible;height:auto;display:block}aside,.lvl,.mc,.leg,.info,.yrf,#map{display:none!important}main{display:block}#mapw{overflow:visible}.dash{position:static!important;display:grid!important}.ban{color:#000;background:#fff;border-bottom:2px solid #000}.ban *{color:#000!important}.ban-l{display:none}}
@media(max-width:820px){html,body{overflow:auto;height:auto}body{display:block}.ban{grid-template-columns:1fr;text-align:center}.ban-r,.ban-l{justify-content:center}.strip{flex-direction:column;align-items:stretch}.kpis{overflow-x:auto}main{display:flex;flex-direction:column}#mapw{height:64vh;flex:none}aside{height:75vh;flex:none;border-inline-end:0}.info{inset-inline-start:12px;top:60px;width:240px}.yrf{width:150px}.dash{grid-template-columns:1fr}.leg{max-width:170px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
